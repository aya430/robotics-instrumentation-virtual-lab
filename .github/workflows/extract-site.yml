name: Extract site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip site.zip into repository root
        run: |
          if [ -f site.zip ]; then
            unzip -o site.zip -d .
            git rm -q site.zip
            git config user.name "github-actions[bot]"
            git config user.email "41898233+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Extract site files from site.zip"
            git push
          else
            echo "No site.zip found; nothing to do."
          fi
