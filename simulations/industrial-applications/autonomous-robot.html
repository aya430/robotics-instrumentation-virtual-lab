<meta name="description" content="A differential-drive robot (v = r(ω_R + ω_L)/2, ω = r(ω_R − ω_L)/b, 4.17) explores a 10 m × 7 m floor. A ring of range sensors marks obstacles in its own occupancy grid; A* (f = g + h) plans the shortest path on that map, treating unknown cells as free, and replans when a new obstacle blocks the path. A pure-pursuit controller converts the path into wheel speeds; odometry integrates noisy wheel encoders.">
